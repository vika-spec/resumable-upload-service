version: "3.9"

# Usage:
#   1. cp .env.example .env   and set SECRET_KEY (and ADMIN_PASSWORD)
#   2. docker compose up --build
# Compose reads .env automatically for the ${...} substitutions below.

services:

  # ── PostgreSQL database ──────────────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER:     uploads
      POSTGRES_PASSWORD: uploads
      POSTGRES_DB:       uploads_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # No published port: the database is only reachable from the app container.
    # To inspect it from your host while developing, add:  ports: ["5432:5432"]
    healthcheck:
      test:     ["CMD-SHELL", "pg_isready -U uploads -d uploads_db"]
      interval: 5s
      timeout:  5s
      retries:  10

  # ── FastAPI application ──────────────────────────────────────────────────────
  app:
    build: .
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL:   postgresql://uploads:uploads@db:5432/uploads_db
      # Required: compose refuses to start if SECRET_KEY is missing.
      SECRET_KEY:     ${SECRET_KEY:?Set SECRET_KEY in .env (see .env.example)}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      CORS_ORIGINS:   ${CORS_ORIGINS:-http://localhost:8000}
    volumes:
      # Persist uploads across container restarts
      - ./storage:/app/storage
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data: